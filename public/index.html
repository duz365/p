<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 皇帝与奴隶 ⛓️</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: radial-gradient(circle at 50% 30%, #26221a, #0c0b09 70%);
            color: #d4af37;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px;
        }
        #app {
            background: linear-gradient(160deg, #2b261d, #1b1812);
            border: 2px solid #d4af37;
            box-shadow: 0 0 40px rgba(212,175,55,.25);
            padding: 24px; border-radius: 12px; max-width: 520px; width: 100%;
            text-align: center; position: relative;
        }
        h2 { margin: 0 0 6px; letter-spacing: 3px; text-shadow: 0 0 12px rgba(212,175,55,.5); }
        .sub { font-size: .75rem; color: #8a7a4a; margin-bottom: 18px; }

        input, button { font-family: inherit; padding: 10px; margin: 5px; border-radius: 6px; }
        input { background: #14110c; color: #e0c88a; border: 1px solid #6b5a2a; letter-spacing: 4px; text-align: center; width: 130px; }
        button { background: #3a2f15; color: #e0c88a; border: 1px solid #d4af37; cursor: pointer; font-weight: bold; transition: all .2s; }
        button:hover { background: #58461c; }
        button:disabled { opacity: .4; cursor: not-allowed; }

        .hidden { display: none !important; }
        #status { margin: 12px 0; font-style: italic; color: #cfb26a; min-height: 20px; }
        #banner { font-size: 1.1em; margin: 8px 0; }
        #roundLabel { color: #cfb26a; font-size: .9em; margin-top: 8px; }
        #handInfo { color: #8a7a4a; font-size: .75rem; margin-top: 4px; }

        #roundContainer { display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .card {
            width: 78px; height: 108px; border: 2px solid #555; border-radius: 8px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #3a3a3a, #262626); transition: all .15s; position: relative;
        }
        .card .emoji { font-size: 30px; }
        .card .name { font-size: 13px; margin-top: 6px; font-weight: bold; }
        .card.emperor .name { color: #ffd700; } .card.emperor { border-color: #ffd700; }
        .card.slave .name { color: #cd7f32; } .card.slave { border-color: #cd7f32; }
        .card.citizen .name { color: #c0c0c0; }
        .card:hover { transform: translateY(-6px); border-color: #d4af37; }
        .card.selected { border-color: #ff4500; box-shadow: 0 0 16px #ff4500; transform: translateY(-8px); }
        .card.used { opacity: .25; cursor: default; }
        #confirmBtn { padding: 12px 34px; font-size: 15px; }

        #result { margin: 10px 0; font-size: 15px; min-height: 44px; padding: 8px; border-top: 1px solid #3a3018; line-height: 1.8; }
        #result .win { color: #ffe14f; } #result .lose { color: #e05555; } #result .draw { color: #aaa; }

        #chatBox { margin-top: 12px; }
        #messages { height: 80px; overflow-y: auto; text-align: left; border: 1px solid #3a3018; padding: 6px; margin: 8px 0; font-size: 13px; background: rgba(0,0,0,.25); }
        #messages div { margin: 2px 0; }
        #messages .you { color: #9be07a; } #messages .opp { color: #e07a7a; } #messages .sys { color: #888; font-style: italic; }
        .chat-row { display: flex; gap: 6px; align-items: center; }
        .chat-row input { flex: 1; width: auto; letter-spacing: 0; text-align: left; }
        .quick { margin-top: 6px; }
        .quick button { padding: 5px 8px; font-size: 15px; background: #241d0f; }

        #gameOver { position: absolute; inset: 0; background: rgba(0,0,0,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-size: 18px; z-index: 5; }
        #gameOver .big { font-size: 46px; margin-bottom: 10px; }
        #gameOver button { margin-top: 16px; font-size: 15px; padding: 12px 28px; }
        #rematchHint { color: #8a7a4a; font-size: .8rem; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>👑 皇帝与奴隶 ⛓️</h2>
        <div class="sub">心理博弈 · 5 回合定胜负 · 输一回合即出局</div>

        <div id="roomArea">
            <div>创建或输入房间号</div>
            <input type="text" id="roomIdInput" placeholder="房间号" maxlength="4" autocapitalize="characters" autocomplete="off">
            <div>
                <button id="createBtn">🏠 创建</button>
                <button id="joinBtn">🚪 加入</button>
            </div>
            <div id="error" style="color:#e05555;min-height:18px;font-size:13px;"></div>
        </div>

        <div id="gameArea" class="hidden">
            <div id="status">等待对手加入...</div>
            <div id="banner"></div>
            <div id="roundLabel"></div>
            <div id="handInfo"></div>
            <div id="roundContainer"></div>
            <button id="confirmBtn" disabled>确认出牌</button>
            <div id="result"></div>

            <div id="chatBox">
                <div id="messages"></div>
                <div class="chat-row">
                    <input type="text" id="chatInput" placeholder="发送嘲讽/欺诈…" maxlength="80">
                    <button id="sendBtn">发送</button>
                </div>
                <div class="quick">
                    <button data-e="😨 我很怕">😨</button>
                    <button data-e="😏 看你死">😏</button>
                    <button data-e="👑 我是皇帝">👑</button>
                    <button data-e="⛓️ 我是奴隶">⛓️</button>
                    <button data-e="🎯 猜猜看">🎯</button>
                    <button data-e="🤡 你被骗了">🤡</button>
                </div>
            </div>
        </div>

        <div id="gameOver" class="hidden">
            <div class="big" id="goEmoji"></div>
            <div id="goText"></div>
            <div id="rematchHint"></div>
            <button id="restartBtn">🔁 再来一局</button>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const EM = { emperor:'👑', citizen:'🏙️', slave:'⛓️' };
        const NM = { emperor:'皇帝', citizen:'市民', slave:'奴隶' };

        let ws = null, roomId = null;
        let myIdx = -1, mySide = null, round = 0, totalRounds = 5;
        let hand = [];
        let selectedCard = null, selectedEl = null;
        let locked = false;
        let over = false;

        let reconnectTimer = null;
        let manualClose = false;
        function connect() {
            if (location.protocol === 'file:') {
                $('error').textContent = '请通过服务器访问，不要直接双击 index.html。\n在项目目录运行 node server.js 后，用浏览器打开 http://localhost:8080';
                return;
            }
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            try {
                ws = new WebSocket(`${proto}://${location.host}`);
            } catch (e) {
                $('error').textContent = 'WebSocket 连接失败: ' + e.message;
                return;
            }
            ws.onopen = () => {
                $('error').textContent = '';
                $('status').textContent = '已连接，等待操作…';
            };
            ws.onmessage = e => {
                let m; try { m = JSON.parse(e.data); } catch { return; }
                handle(m);
            };
            ws.onerror = () => { $('error').textContent = '连接出错，正在重连…'; };
            ws.onclose = () => {
                if (manualClose) return;
                $('status').textContent = '连接已断开，正在重连…';
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connect, 1500);
            };
        }

        function handle(m) {
            switch (m.type) {
                case 'room_created':
                    roomId = m.roomId;
                    $('roomIdInput').value = roomId;
                    showStatus(`房间号 <b>${roomId}</b> · 等待对手加入…`);
                    break;
                case 'joined_room':
                    roomId = m.roomId;
                    $('roomIdInput').value = roomId;
                    showStatus('已加入，等待开局…');
                    break;
                case 'gameStart':
                    myIdx = m.player; mySide = m.side; totalRounds = m.round || 5;
                    showGameArea();
                    renderSide();
                    over = false;
                    break;
                case 'newRound':
                    round = m.round;
                    hand = m.hand.slice();
                    locked = false;
                    selectedCard = null; selectedEl = null;
                    renderSide();
                    $('roundLabel').textContent = `第 ${round} / ${m.total} 回合`;
                    $('result').textContent = '';
                    buildCards();
                    showStatus('');
                    break;
                case 'moveLocked':
                    locked = true;
                    hand = m.hand.slice();
                    $('confirmBtn').disabled = true;
                    disableCards();
                    showStatus(`你已出 <b>${NM[m.card]}</b>，等待对手…`);
                    break;
                case 'roundResult':
                    renderResult(m);
                    break;
                case 'gameReady':
                    break;
                case 'chat':
                    addChat(m.from === myIdx ? 'you' : 'opp', m.msg);
                    break;
                case 'gameOver':
                    showGameOver(m);
                    break;
                case 'rematchWaiting':
                    $('rematchHint').textContent = '对手已点「再来一局」，等待你确认…';
                    break;
                case 'opponentLeft':
                    showGameOver({ aborted: true });
                    break;
                case 'error':
                    $('error').textContent = m.msg;
                    break;
            }
        }

        function showStatus(t) { $('status').innerHTML = t; }
        function showGameArea() {
            $('roomArea').classList.add('hidden');
            $('gameArea').classList.remove('hidden');
        }
        function renderSide() {
            $('banner').innerHTML = `你的阵营：<strong>${mySide === 'emperor' ? '👑 皇帝方' : '⛓️ 奴隶方'}</strong>`;
        }

        function buildCards() {
            const box = $('roundContainer');
            box.innerHTML = '';
            hand.forEach(card => {
                const d = document.createElement('div');
                d.className = 'card ' + card;
                d.innerHTML = `<div class="emoji">${EM[card]}</div><div class="name">${NM[card]}</div>`;
                d.onclick = () => selectCard(card, d);
                box.appendChild(d);
            });
            $('handInfo').textContent = `剩余手牌 ${hand.length} 张 · 用过即弃`;
            $('confirmBtn').disabled = true;
        }

        function selectCard(card, el) {
            if (locked || over) return;
            if (selectedEl === el) {
                selectedEl.classList.remove('selected');
                selectedCard = null; selectedEl = null;
                $('confirmBtn').disabled = true;
                return;
            }
            if (selectedEl) selectedEl.classList.remove('selected');
            selectedCard = card; selectedEl = el;
            el.classList.add('selected');
            $('confirmBtn').disabled = false;
        }

        function disableCards() {
            document.querySelectorAll('#roundContainer .card').forEach(c => {
                c.classList.remove('selected');
                c.style.pointerEvents = 'none';
            });
        }

        $('confirmBtn').onclick = () => {
            if (selectedCard == null || locked || over) return;
            locked = true;
            $('confirmBtn').disabled = true;
            selectedEl.classList.add('used');
            disableCards();
            ws.send(JSON.stringify({ type: 'play', card: selectedCard }));
        };

        function renderResult(m) {
            const myName = m.cards[myIdx];
            const oppName = m.cards[1 - myIdx];
            let line;
            if (m.winner === myIdx) line = `<span class="win">🎉 你赢了这回合，对手出局！</span>`;
            else if (m.winner === -1) line = `<span class="draw">🤝 平局，进入下一回合</span>`;
            else line = `<span class="lose">💔 你输了这回合，出局！</span>`;
            $('result').innerHTML = `第${m.round}回合 · 你出 <strong>${myName}</strong> vs 对手出 <strong>${oppName}</strong><br>${line}`;
        }

        function addChat(who, msg) {
            const box = $('messages');
            const d = document.createElement('div');
            d.className = who;
            d.textContent = (who === 'you' ? '你：' : '对手：') + msg;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        function showGameOver(m) {
            over = true;
            $('gameOver').classList.remove('hidden');
            $('rematchHint').textContent = '';
            if (m && m.aborted) {
                $('goEmoji').textContent = '🚪';
                $('goText').textContent = '对手离开了';
                $('restartBtn').style.display = 'none';
            } else if (m && m.draw) {
                $('goEmoji').textContent = '🤝';
                $('goText').textContent = '5 回合全平局！';
            } else if (m && m.youWin === true) {
                $('goEmoji').textContent = '👑';
                $('goText').textContent = '你赢了！';
            } else {
                $('goEmoji').textContent = '⛓️';
                $('goText').textContent = '你输了…';
            }
        }

        $('createBtn').onclick = () => { $('error').textContent = ''; ws.send(JSON.stringify({ type: 'create' })); };
        $('joinBtn').onclick = () => {
            const id = $('roomIdInput').value.trim().toUpperCase();
            if (!id) { $('error').textContent = '请输入房间号'; return; }
            $('error').textContent = '';
            ws.send(JSON.stringify({ type: 'join', roomId: id }));
        };
        $('roomIdInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });

        function sendChat() {
            const v = $('chatInput').value.trim();
            if (v) {
                ws.send(JSON.stringify({ type: 'chat', msg: v }));
                $('chatInput').value = '';
            }
        }
        $('sendBtn').onclick = sendChat;
        $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
        document.querySelectorAll('.quick button').forEach(b => {
            b.onclick = () => {
                ws.send(JSON.stringify({ type: 'chat', msg: b.dataset.e }));
                addChat('you', b.dataset.e);
            };
        });

        // 再来一局：直接通知服务器，同房间重开，无需重建房间
        $('restartBtn').onclick = () => {
            $('gameOver').classList.add('hidden');
            showStatus('已请求再来一局，等待对手…');
            ws.send(JSON.stringify({ type: 'rematch' }));
        };

        connect();
    </script>
</body>
</html>
